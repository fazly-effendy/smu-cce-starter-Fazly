# Nimbus look and feel. Streamlit reads this file when the app is started
# from the repository root (python3 -m streamlit run src/app.py), locally and
# on EC2. Colours match src/ui/theme.py.

[theme]
base = "dark"
primaryColor = "#2563EB"            # one accent: buttons, links, tab underline, first chart line
backgroundColor = "#0E1424"         # page
secondaryBackgroundColor = "#172036" # sidebar, inputs, table headers
textColor = "#E6EAF2"
font = "sans serif"

[browser]
gatherUsageStats = false
