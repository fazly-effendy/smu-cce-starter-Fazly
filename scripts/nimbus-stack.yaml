AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Nimbus (DS600) - Stage 3, with automatic scaling. A VPC with public and private
  subnets in two Availability Zones; Amazon RDS for MySQL in the private subnets,
  reachable only from the app servers; an Application Load Balancer; and an Auto
  Scaling group of EC2 app servers (launch template + EC2 user data that clones
  Nimbus from GitHub and runs it on port 8501), scaled by target tracking on CPU
  and on requests per server (Lesson 9, AACF Module 10 and Lab 6).
  Region: us-east-1 (AWS Academy Sandbox).

# ---------------------------------------------------------------------------
# Parameters: values chosen when the stack is created
# ---------------------------------------------------------------------------
Parameters:
  GitHubRepoUrl:
    Type: String
    Default: https://github.com/fazly-effendy/smu-cce-starter-Fazly.git
    Description: Public Git repository that holds Nimbus.
  GitBranch:
    Type: String
    Default: main
    Description: Branch to deploy (e.g. feature/unified-nimbus-prototype before it is merged).
  GitCommit:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[0-9a-f]{7,40}$"
    ConstraintDescription: Empty, or a commit hash of 7-40 lower-case hex characters (e.g. e49a2c6).
    Description: >
      Exact commit to deploy (e.g. e49a2c6). Leave empty to deploy the latest commit of GitBranch.
      The commit must be on GitBranch. Setup fails, and the stack shows CREATE_FAILED, if it is not found.
  InstanceProfileName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^[A-Za-z0-9+=,.@_-]{1,128}$"
    ConstraintDescription: Empty, or an existing instance profile name (e.g. LabInstanceProfile).
    Description: >
      Leave empty (recommended): the app server gets no IAM role, because Nimbus calls no AWS APIs
      (least privilege). Only set an existing instance profile, e.g. the Sandbox's LabInstanceProfile,
      if a later change needs AWS credentials on the server.
  ImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-0fef201115eefe936
    Description: Amazon Linux 2023 AMI used in Lessons 6 and 7 (us-east-1).
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues: [t2.micro, t3.micro, t3.small]
    Description: EC2 instance size.
  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Default: vockey
    Description: Existing key pair (the Sandbox provides vockey).
  AllowedWebCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: >
      Who may open Nimbus (the load balancer, port 80). 0.0.0.0/0 = anyone (needed for a class demo).
      The app servers themselves accept traffic only from the load balancer.
  AllowedSshCidr:
    Type: String
    Default: 127.0.0.1/32
    Description: >
      Who may SSH to the app servers. Closed by default (127.0.0.1/32); use the EC2 system log for
      troubleshooting, or set this to your own IP followed by /32 if you need SSH.
  DBUsername:
    Type: String
    Default: nimbusadmin
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9]*"
    ConstraintDescription: Letters and digits only, starting with a letter (1-16 characters).
    Description: Master username for the RDS database.
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    AllowedPattern: "[a-zA-Z0-9]*"
    ConstraintDescription: 8-41 letters and digits only (no symbols, so it is safe inside a database URL).
    Description: >
      Master password for the RDS database. Type a new one when you create the stack; it is
      never shown again by CloudFormation (NoEcho). Do not reuse a real password.
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t4g.micro]
    Description: RDS instance size (smallest classes only, to stay within the Sandbox).
  DBEngineVersion:
    Type: String
    Default: "8.4"
    Description: MySQL major version. RDS picks the current minor version.
  MinServers:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 2
    Description: Fewest app servers the Auto Scaling group keeps running (also the number at creation).
  MaxServers:
    Type: Number
    Default: 3
    MinValue: 3
    MaxValue: 4
    Description: >
      Most app servers the Auto Scaling group may run under load (kept small for the Sandbox). At least
      3, so there is always room above MinServers for scaling and for a rolling update.
  CpuTargetPercent:
    Type: Number
    Default: 60
    MinValue: 20
    MaxValue: 90
    Description: >
      Target tracking on average CPU across the app servers (as in Lab 6): add servers when it stays
      above this, remove them when it stays well below.
  RequestsPerServerTarget:
    Type: Number
    Default: 1000
    MinValue: 50
    MaxValue: 100000
    Description: >
      Target tracking on load-balancer requests per server per minute: add servers when the average
      stays above this. Normal use by a few RMs is far below it; a load test exceeds it.

Conditions:
  HasInstanceProfile: !Not [!Equals [!Ref InstanceProfileName, ""]]

Resources:
  # -------------------------------------------------------------------------
  # Network: VPC, internet gateway, two public and two private subnets
  # (same address plan as Lab 2: 10.0.0.0/24 and 10.0.2.0/24 public,
  # 10.0.1.0/24 and 10.0.3.0/24 private)
  # -------------------------------------------------------------------------
  NimbusVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: nimbus-vpc}]

  NimbusInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: nimbus-igw}]

  NimbusGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref NimbusVpc
      InternetGatewayId: !Ref NimbusInternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: nimbus-public-a}]

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags: [{Key: Name, Value: nimbus-public-b}]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: nimbus-private-a}]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref NimbusVpc
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{Key: Name, Value: nimbus-private-b}]

  # Public route table: internet traffic goes to the internet gateway.
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NimbusVpc
      Tags: [{Key: Name, Value: nimbus-rtb-public}]

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: NimbusGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref NimbusInternetGateway

  PublicSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # Private route table: no route to the internet at all. The database (Stage 2)
  # only needs to be reached from inside the VPC, so no NAT gateway is created.
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref NimbusVpc
      Tags: [{Key: Name, Value: nimbus-rtb-private}]

  PrivateSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # -------------------------------------------------------------------------
  # Security groups: the internet reaches only the load balancer (port 80);
  # the app servers accept Streamlit traffic (8501) only from the load balancer
  # -------------------------------------------------------------------------
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Nimbus load balancer - HTTP 80 from AllowedWebCidr
      VpcId: !Ref NimbusVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AllowedWebCidr
          Description: Nimbus in the browser
      Tags: [{Key: Name, Value: nimbus-alb-sg}]

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Nimbus app servers - Streamlit 8501 from the load balancer only; SSH closed unless AllowedSshCidr is set
      VpcId: !Ref NimbusVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
          Description: Streamlit from nimbus-alb-sg only
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedSshCidr
          Description: SSH (closed by default)
      Tags: [{Key: Name, Value: nimbus-app-sg}]

  # -------------------------------------------------------------------------
  # Database: Amazon RDS for MySQL in the private subnets (Lesson 8 design).
  # Not publicly accessible; the only way in is port 3306 from the app
  # server's security group.
  # -------------------------------------------------------------------------
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Nimbus database - MySQL only from the Nimbus app server security group
      VpcId: !Ref NimbusVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          SourceSecurityGroupId: !Ref AppSecurityGroup
          Description: MySQL from nimbus-app-sg only
      Tags: [{Key: Name, Value: nimbus-db-sg}]

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Nimbus database - private subnets in two Availability Zones
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Tags: [{Key: Name, Value: nimbus-db-subnets}]

  NimbusDatabase:
    Type: AWS::RDS::DBInstance
    Metadata:
      cfn-lint:
        config:
          # W1011 suggests Secrets Manager. We use a NoEcho parameter, the mechanism used in the
          # course; see "Known limitations" in docs/aws-deployment.md.
          ignore_checks: [W1011]
    DeletionPolicy: Delete  # Sandbox: no final snapshot left behind when the stack is deleted
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub ${AWS::StackName}-db
      Engine: mysql
      EngineVersion: !Ref DBEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: "20"
      StorageType: gp2
      DBName: nimbus
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0  # Sandbox: no automated backups (faster to create; see docs/aws-deployment.md)
      DeletionProtection: false
      Tags: [{Key: Name, Value: nimbus-db}]

  # -------------------------------------------------------------------------
  # Load balancer: one stable address for every app server. Sticky sessions
  # keep each user on the same server, because a Streamlit session (the
  # comparison on screen, unsaved notes) lives in that server's memory.
  # -------------------------------------------------------------------------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: NimbusGatewayAttachment
    Properties:
      Name: !Sub ${AWS::StackName}-alb
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "300"  # keep Streamlit's live connection open between interactions
      Tags: [{Key: Name, Value: nimbus-alb}]

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub ${AWS::StackName}-app-tg
      VpcId: !Ref NimbusVpc
      Protocol: HTTP
      Port: 8501
      TargetType: instance
      HealthCheckProtocol: HTTP
      HealthCheckPath: /_stcore/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: "200"}
      TargetGroupAttributes:
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: "86400"
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags: [{Key: Name, Value: nimbus-app-tg}]

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  # -------------------------------------------------------------------------
  # Launch template: how every app server is built. User data installs Nimbus
  # and starts it as a systemd service (restarts automatically and survives
  # reboots). At stack creation and during a rolling update, each new server
  # signals CloudFormation (cfn-signal) only after the app has reached RDS and
  # answers its health check.
  # -------------------------------------------------------------------------
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub ${AWS::StackName}-app
      LaunchTemplateData:
        ImageId: !Ref ImageId
        InstanceType: !Ref InstanceType
        KeyName: !Ref KeyName
        # IAM: none by default (Nimbus needs no AWS credentials); see InstanceProfileName.
        IamInstanceProfile: !If [HasInstanceProfile, {Name: !Ref InstanceProfileName}, !Ref "AWS::NoValue"]
        SecurityGroupIds: [!Ref AppSecurityGroup]
        MetadataOptions: {HttpTokens: required}
        TagSpecifications:
          - ResourceType: instance
            Tags: [{Key: Name, Value: nimbus-app}]
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            exec > >(tee -a /var/log/nimbus-setup.log) 2>&1

            signal() {
              /opt/aws/bin/cfn-signal -e "$1" --reason "$2" \
                --stack ${AWS::StackName} --resource AppAutoScalingGroup --region ${AWS::Region} || true
            }
            trap 'signal 1 "Nimbus setup failed: see the EC2 system log (lines after nimbus-setup)"' ERR

            # 1. System packages (Python 3.9 ships with Amazon Linux 2023)
            dnf install -y git python3-pip aws-cfn-bootstrap

            # 2. Get the application from GitHub: the latest commit of GitBranch, or exactly
            #    GitCommit if one is given (full clone, so a short hash can be checked out)
            APP_DIR=/home/ec2-user/nimbus
            REQUESTED_COMMIT="${GitCommit}"
            if [ -n "$REQUESTED_COMMIT" ]; then
              git clone --branch "${GitBranch}" "${GitHubRepoUrl}" "$APP_DIR"
              if ! git -C "$APP_DIR" rev-parse --verify --quiet "$REQUESTED_COMMIT^{commit}" >/dev/null; then
                echo "nimbus-setup: commit $REQUESTED_COMMIT not found in ${GitHubRepoUrl}"
                signal 1 "Commit ${GitCommit} not found in the repository: check the GitCommit parameter"
                exit 1
              fi
              git -C "$APP_DIR" checkout --detach "$REQUESTED_COMMIT"
            else
              git clone --depth 1 --branch "${GitBranch}" "${GitHubRepoUrl}" "$APP_DIR"
            fi

            # 3. Install dependencies in a virtual environment: exact versions from
            #    requirements-lock.txt, so every deployment gets the same packages
            python3 -m venv "$APP_DIR/.venv"
            "$APP_DIR/.venv/bin/python" -m pip install --upgrade pip
            REQS="$APP_DIR/requirements-lock.txt"
            [ -f "$REQS" ] || REQS="$APP_DIR/requirements.txt"
            "$APP_DIR/.venv/bin/python" -m pip install -r "$REQS"
            COMMIT=$(git -C "$APP_DIR" rev-parse --short HEAD)
            # Written to the EC2 system log (Actions > Monitor and troubleshoot > Get system log),
            # so the deployed commit can be proven from the AWS side as well as in the app.
            echo "nimbus-setup: deployed commit $COMMIT from branch ${GitBranch} (requested commit: ${!REQUESTED_COMMIT:-latest})"
            mkdir -p "$APP_DIR/analyses-data"
            chown -R ec2-user:ec2-user "$APP_DIR"

            # 4. Database settings. Tracing is switched off from here on so the
            #    password is never written to the setup log or the system log.
            #    The file is readable by root only; systemd passes it to the app.
            set +x
            umask 077
            cat > /etc/nimbus.env <<EOF
            NIMBUS_DATA_DIR=$APP_DIR/analyses-data
            NIMBUS_COMMIT=$COMMIT
            NIMBUS_DATABASE_URL=mysql+pymysql://${DBUsername}:${DBPassword}@${NimbusDatabase.Endpoint.Address}:${NimbusDatabase.Endpoint.Port}/nimbus?charset=utf8mb4
            EOF
            umask 022

            # 5. Check the app server can reach RDS and create the tables
            ( set -a; . /etc/nimbus.env; set +a
              cd "$APP_DIR" && runuser -u ec2-user -- .venv/bin/python scripts/check_database.py ) \
              || { signal 1 "Nimbus cannot reach RDS: check nimbus-db-sg and the database status"; exit 1; }

            # 6. Run Nimbus as a service on port 8501
            cat > /etc/systemd/system/nimbus.service <<EOF
            [Unit]
            Description=Nimbus Streamlit app
            After=network-online.target
            Wants=network-online.target

            [Service]
            User=ec2-user
            WorkingDirectory=$APP_DIR
            EnvironmentFile=/etc/nimbus.env
            ExecStart=$APP_DIR/.venv/bin/python -m streamlit run src/app.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
            Restart=always
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable --now nimbus

            # 7. Wait until the app answers, then tell CloudFormation it worked
            for _ in $(seq 1 60); do
              if curl -sf http://127.0.0.1:8501/_stcore/health; then
                signal 0 "Nimbus (commit $COMMIT) is running on port 8501 and connected to RDS"
                exit 0
              fi
              sleep 5
            done
            signal 1 "Nimbus did not answer its health check within 5 minutes: run 'journalctl -u nimbus'"

  # -------------------------------------------------------------------------
  # Auto Scaling group (Feature 6): keeps MinServers running across both
  # Availability Zones, replaces a server that fails the load balancer's health
  # check, and adds or removes servers automatically through the two
  # target-tracking policies below. A new GitCommit (Update stack) replaces the
  # servers one at a time; the database is not touched.
  # -------------------------------------------------------------------------
  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: PublicDefaultRoute  # new servers need the internet (GitHub, Python packages, Yahoo)
    CreationPolicy:
      ResourceSignal:
        Count: !Ref MinServers
        Timeout: PT25M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MaxBatchSize: 1
        MinInstancesInService: !Ref MinServers
        PauseTime: PT25M
        WaitOnResourceSignals: true
        SuspendProcesses: [HealthCheck, ReplaceUnhealthy, AZRebalance, AlarmNotification, ScheduledActions]
    Properties:
      AutoScalingGroupName: !Sub ${AWS::StackName}-app-asg
      VPCZoneIdentifier: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinServers
      MaxSize: !Ref MaxServers
      # No DesiredCapacity: it starts at MinServers, and a later stack update does not
      # reset a capacity that scaling has changed.
      TargetGroupARNs: [!Ref AppTargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 900  # a new server needs about 6-10 minutes to install Nimbus
      MetricsCollection:
        - Granularity: 1Minute  # group metrics (e.g. GroupInServiceInstances) for the scaling evidence
      Tags:
        - Key: Project
          Value: nimbus
          PropagateAtLaunch: true

  # Target tracking keeps a metric near its target, like a thermostat. Each policy
  # creates its own CloudWatch alarms. With two policies, the group adds a server
  # when either metric is above its target, and removes one only when both are
  # well below theirs.
  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 600
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: !Ref CpuTargetPercent

  RequestScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    DependsOn: HttpListener  # the metric exists only once the target group is attached to the listener
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      EstimatedInstanceWarmup: 600
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Join ["/", [!GetAtt LoadBalancer.LoadBalancerFullName, !GetAtt AppTargetGroup.TargetGroupFullName]]
        TargetValue: !Ref RequestsPerServerTarget

Outputs:
  NimbusUrl:
    Description: Open this in a browser (http, not https). It is the load balancer, so it stays the same when servers change.
    Value: !Sub http://${LoadBalancer.DNSName}
  AutoScalingGroup:
    Description: App servers (EC2 > Auto Scaling groups > Activity shows every launch and termination)
    Value: !Ref AppAutoScalingGroup
  TargetGroup:
    Description: Load balancer targets (EC2 > Target groups > Targets shows each server's health)
    Value: !GetAtt AppTargetGroup.TargetGroupName
  InstanceProfile:
    Description: IAM instance profile attached to the app servers
    Value: !If [HasInstanceProfile, !Ref InstanceProfileName, "none"]
  VpcId:
    Description: VPC for Nimbus
    Value: !Ref NimbusVpc
  PrivateSubnets:
    Description: Private subnets that hold the database
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  DatabaseEndpoint:
    Description: RDS endpoint (reachable only from inside the VPC, from nimbus-app-sg)
    Value: !GetAtt NimbusDatabase.Endpoint.Address
  DatabaseName:
    Description: Database that holds the clients, discussions and discussion_companies tables
    Value: nimbus
